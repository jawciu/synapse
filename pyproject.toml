[project]
name = "langchain-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.19",
    "httpx>=0.28.1",
    "slowapi>=0.1.9",
    "langgraph>=0.6.7",
    "langchain-openai>=1.1.3",
    "langchain-surrealdb>=0.2.0",
    "fastapi>=0.117.0",
    "langsmith>=0.1.0",
    "numpy>=2.4.2",
    "python-dotenv>=1.2.1",
    "python-telegram-bot[job-queue]>=21.0",
    "surrealdb>=1.0.8",
    "uvicorn>=0.37.0",
    "langchain-anthropic>=1.2.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "pytest>=8.4.0",
]

[dependency-groups]
security = ["pip>=26.2.2"]
audit = ["pip-audit>=2.9.0"]

[project.optional-dependencies]
redis = ["redis>=5"]

[tool.uv]
required-version = ">=0.13.4"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
